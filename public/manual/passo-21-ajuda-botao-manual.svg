  .real-screen-canvas .pill-red { background: #fee2e2; color: #991b1b; }
  .real-screen-canvas .pill-blue { background: #dbeafe; color: #1e40af; }
  .real-screen-canvas .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
