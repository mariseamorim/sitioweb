    <text x="44" y="42" fill="#dcfce7" font-family="system-ui, sans-serif" font-size="11">Fazenda Santa Clara · Troca de propriedade, alertas do dia e visão mensal/anual</text>
    <rect x="570" y="15" width="116" height="24" rx="12" fill="#ffffff" opacity="0.18"/>
