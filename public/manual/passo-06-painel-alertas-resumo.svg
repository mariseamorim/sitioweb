  <!-- Callouts Overlay -->
  
    <g transform="translate(58, 140)">
      <circle cx="0" cy="0" r="15" fill="#dc2626" stroke="#ffffff" stroke-width="2.5" filter="url(#shadow)" />
      <text x="0" y="5" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800">1</text>
      
        <rect x="20" y="-13" width="175" height="26" rx="6" fill="#111827" opacity="0.92" />
        <text x="30" y="4" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600">Alertas de carência e vacina</text>
      
    </g>
  

    <g transform="translate(545, 112)">
      <circle cx="0" cy="0" r="15" fill="#dc2626" stroke="#ffffff" stroke-width="2.5" filter="url(#shadow)" />
      <text x="0" y="5" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800">2</text>
      
        <rect x="20" y="-13" width="142" height="26" rx="6" fill="#111827" opacity="0.92" />
        <text x="30" y="4" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600">Troque Mensal / Anual</text>
      
