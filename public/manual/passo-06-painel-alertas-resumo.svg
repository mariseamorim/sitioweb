        <rect x="362" y="244" width="274" height="64" rx="8" fill="#f1f5f9"/>
        <text x="374" y="264" fill="#334155" font-family="monospace" font-size="10.5">Set/26: 5.980 L | Saldo +R$  9.840</text>
        <text x="374" y="281" fill="#334155" font-family="monospace" font-size="10.5">Out/26: 6.210 L | Saldo +R$ 10.620</text>
        <text x="374" y="298" fill="#15803d" font-family="monospace" font-size="10.5" font-weight="700">Nov/26: 6.420 L | Saldo +R$ 11.250</text>
      
