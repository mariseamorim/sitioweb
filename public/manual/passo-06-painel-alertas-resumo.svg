        <text x="374" y="96" fill="#14532d" font-family="system-ui, sans-serif" font-size="17" font-weight="800">6.420 L</text>
        <text x="374" y="113" fill="#15803d" font-family="system-ui, sans-serif" font-size="10">≈ R$ 17.013,00</text>

        <rect x="504" y="54" width="132" height="68" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
        <text x="516" y="74" fill="#64748b" font-family="system-ui, sans-serif" font-size="10.5">Nascimentos</text>
        <text x="516" y="98" fill="#0f172a" font-family="system-ui, sans-serif" font-size="18" font-weight="800">4 crias</text>

        <rect x="362" y="132" width="274" height="82" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
        <text x="376" y="154" fill="#15803d" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Receitas: R$ 19.400,00</text>
        <text x="376" y="174" fill="#dc2626" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Despesas: R$ 8.150,00</text>
        <text x="376" y="198" fill="#0f172a" font-family="system-ui, sans-serif" font-size="14" font-weight="800">Saldo do Mês: + R$ 11.250,00</text>

