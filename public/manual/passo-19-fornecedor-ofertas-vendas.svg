<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#ecfdf5"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="760" height="460" rx="18" fill="url(#bgGrad)" stroke="#bbf7d0" stroke-width="1.5"/>

  <!-- Top Browser / App Frame -->
  <g transform="translate(28, 22)" filter="url(#shadow)">
    <rect width="704" height="416" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <!-- App Topbar -->
    <path d="M0 14 Q0 0 14 0 L690 0 Q704 0 704 14 L704 54 L0 54 Z" fill="#b45309"/>
    <!-- Brand Dot & Title -->
    <circle cx="24" cy="27" r="11" fill="#ffffff" opacity="0.2"/>
    <text x="24" y="31" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="800">🌱</text>
    <text x="44" y="25" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="800">Anota Aí Agro — Portal do Fornecedor — Ofertas, Cotações e Vendas</text>
    <text x="44" y="42" fill="#dcfce7" font-family="system-ui, sans-serif" font-size="11">Agropecuária Boi Forte · Alcance regional, orçamentos e relatório de conversão</text>
    <rect x="570" y="15" width="116" height="24" rx="12" fill="#ffffff" opacity="0.18"/>
    <text x="628" y="31" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Portal Fornecedor</text>

    <!-- Screen Inner Content -->
    <g transform="translate(20, 68)">
      
        <!-- Top metrics cards -->
        <rect x="10" y="6" width="154" height="62" rx="10" fill="#fffbeb" stroke="#f59e0b"/>
        <text x="24" y="28" fill="#92400e" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">Pedidos de Orçamento</text>
        <text x="24" y="54" fill="#b45309" font-family="system-ui, sans-serif" font-size="20" font-weight="800">3 novos</text>

        <rect x="174" y="6" width="154" height="62" rx="10" fill="#f0fdf4" stroke="#86efac"/>
        <text x="188" y="28" fill="#166534" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">Ofertas Ativas</text>
        <text x="188" y="54" fill="#15803d" font-family="system-ui, sans-serif" font-size="20" font-weight="800">6 ofertas</text>

        <rect x="338" y="6" width="154" height="62" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
        <text x="352" y="28" fill="#1e40af" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">Cliques WhatsApp</text>
        <text x="352" y="54" fill="#1d4ed8" font-family="system-ui, sans-serif" font-size="20" font-weight="800">28 contatos</text>

        <rect x="502" y="6" width="152" height="62" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
        <text x="516" y="28" fill="#991b1b" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">Vendas no Mês</text>
        <text x="516" y="54" fill="#dc2626" font-family="system-ui, sans-serif" font-size="18" font-weight="800">R$ 18.420 (64%)</text>

        <!-- Left: Contacts to confirm -->
        <rect x="10" y="80" width="325" height="244" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
        <text x="26" y="106" fill="#0f172a" font-family="system-ui, sans-serif" font-size="13" font-weight="800">📲 Contatos pelo WhatsApp a Confirmar</text>

        <rect x="26" y="120" width="293" height="114" rx="10" fill="#fffbeb" stroke="#fcd34d"/>
        <text x="38" y="142" fill="#0f172a" font-family="system-ui, sans-serif" font-size="12" font-weight="800">Fazenda Santa Clara clicou na oferta:</text>
        <text x="38" y="160" fill="#92400e" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">"Ração Lactação 22% — R$ 94,00/saco"</text>
        <text x="38" y="178" fill="#64748b" font-family="system-ui, sans-serif" font-size="10.5">Qtd: 30 sacos · Valor: R$ 2.820,00</text>
        <rect x="38" y="190" width="134" height="32" rx="6" fill="#15803d"/>
        <text x="105" y="210" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700">✓ Virou Venda</text>
        <rect x="182" y="190" width="124" height="32" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
        <text x="244" y="210" text-anchor="middle" fill="#475569" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✕ Não fechou</text>

        <rect x="26" y="248" width="293" height="60" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
        <text x="172" y="282" text-anchor="middle" fill="#15803d" font-family="system-ui, sans-serif" font-size="12" font-weight="800">+ Registrar Venda Manual (Balcão / Telefone)</text>

        <!-- Right: Quotes & Ranking -->
        <rect x="347" y="80" width="307" height="244" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
        <text x="364" y="106" fill="#0f172a" font-family="system-ui, sans-serif" font-size="13" font-weight="800">🏆 Ranking das Ofertas Campeãs no Mês</text>

        <rect x="364" y="120" width="273" height="56" rx="8" fill="#f0fdf4" stroke="#86efac"/>
        <text x="376" y="142" fill="#14532d" font-family="system-ui, sans-serif" font-size="12" font-weight="800">1º Ração Lactação 22% (40 kg)</text>
        <text x="376" y="162" fill="#166534" font-family="system-ui, sans-serif" font-size="11">11 vendas · R$ 12.408,00 · Conversão: 68%</text>

        <rect x="364" y="186" width="273" height="56" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
        <text x="376" y="208" fill="#0f172a" font-family="system-ui, sans-serif" font-size="12" font-weight="700">2º Proteinado Águas (30 kg)</text>
        <text x="376" y="228" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">7 vendas · R$ 6.012,00 · Conversão: 58%</text>

        <rect x="364" y="254" width="273" height="54" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
        <text x="500" y="286" text-anchor="middle" fill="#1d4ed8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">+ Publicar Nova Oferta para a Região</text>
      
    </g>
  </g>

  <!-- Callouts Overlay -->
  
    <g transform="translate(64, 270)">
      <circle cx="0" cy="0" r="15" fill="#dc2626" stroke="#ffffff" stroke-width="2.5" filter="url(#shadow)" />
      <text x="0" y="5" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800">1</text>
      
        <rect x="20" y="-13" width="152" height="26" rx="6" fill="#111827" opacity="0.92" />
        <text x="30" y="4" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600">Confirme se virou venda</text>
      
    </g>
  

    <g transform="translate(400, 210)">
      <circle cx="0" cy="0" r="15" fill="#dc2626" stroke="#ffffff" stroke-width="2.5" filter="url(#shadow)" />
      <text x="0" y="5" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800">2</text>
      
        <rect x="20" y="-13" width="138" height="26" rx="6" fill="#111827" opacity="0.92" />
        <text x="30" y="4" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600">Ranking e conversão</text>
      
    </g>
  

    <g transform="translate(400, 345)">
      <circle cx="0" cy="0" r="15" fill="#dc2626" stroke="#ffffff" stroke-width="2.5" filter="url(#shadow)" />
      <text x="0" y="5" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800">3</text>
      
        <rect x="20" y="-13" width="165" height="26" rx="6" fill="#111827" opacity="0.92" />
        <text x="30" y="4" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600">Publique ofertas regionais</text>
      
    </g>
  
</svg>