<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#ecfdf5"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="760" height="460" rx="18" fill="url(#bgGrad)" stroke="#bbf7d0" stroke-width="1.5"/>

  <!-- Top Browser / App Frame -->
  <g transform="translate(28, 22)" filter="url(#shadow)">
    <rect width="704" height="416" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <!-- App Topbar -->
    <path d="M0 14 Q0 0 14 0 L690 0 Q704 0 704 14 L704 54 L0 54 Z" fill="#15803d"/>
    <!-- Brand Dot & Title -->
    <circle cx="24" cy="27" r="11" fill="#ffffff" opacity="0.2"/>
    <text x="24" y="31" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="800">🌱</text>
    <text x="44" y="25" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="800">Anota Aí Agro — Financeiro & Relatórios (PDF / Planilha CSV)</text>
    <text x="44" y="42" fill="#dcfce7" font-family="system-ui, sans-serif" font-size="11">Fluxo de caixa completo com suporte offline e exportação com 1 clique</text>
    <rect x="570" y="15" width="116" height="24" rx="12" fill="#ffffff" opacity="0.18"/>
    <text x="628" y="31" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Financeiro & PDF</text>

    <!-- Screen Inner Content -->
    <g transform="translate(20, 68)">
      
        <!-- Left: Financeiro -->
        <rect x="10" y="6" width="320" height="318" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
        <text x="28" y="34" fill="#0f172a" font-family="system-ui, sans-serif" font-size="14" font-weight="800">💰 Fluxo de Caixa — Novembro/2026</text>

        <rect x="28" y="48" width="90" height="50" rx="8" fill="#f0fdf4" stroke="#86efac"/>
        <text x="36" y="66" fill="#166534" font-family="system-ui, sans-serif" font-size="10">Receitas</text>
        <text x="36" y="86" fill="#15803d" font-family="system-ui, sans-serif" font-size="12.5" font-weight="800">R$ 19.400</text>

        <rect x="125" y="48" width="90" height="50" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
        <text x="133" y="66" fill="#991b1b" font-family="system-ui, sans-serif" font-size="10">Despesas</text>
        <text x="133" y="86" fill="#dc2626" font-family="system-ui, sans-serif" font-size="12.5" font-weight="800">R$ 8.150</text>

        <rect x="222" y="48" width="90" height="50" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
        <text x="230" y="66" fill="#1e40af" font-family="system-ui, sans-serif" font-size="10">Saldo</text>
        <text x="230" y="86" fill="#1d4ed8" font-family="system-ui, sans-serif" font-size="12.5" font-weight="800">+R$ 11.250</text>

        <rect x="28" y="110" width="284" height="36" rx="8" fill="#15803d"/>
        <text x="170" y="133" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700">+ Anotar Entrada ou Saída</text>

        <rect x="28" y="158" width="284" height="44" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
        <text x="40" y="177" fill="#15803d" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">+ R$ 16.400,00 · Venda de Leite (Outubro)</text>
        <text x="40" y="193" fill="#64748b" font-family="system-ui, sans-serif" font-size="10.5">10/11/2026 · Receita</text>

        <rect x="28" y="210" width="284" height="44" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
        <text x="40" y="229" fill="#dc2626" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">- R$ 2.940,00 · Compra Ração 22% (30 sc)</text>
        <text x="40" y="245" fill="#64748b" font-family="system-ui, sans-serif" font-size="10.5">12/11/2026 · Despesa Nutrição</text>

        <!-- Right: Relatorios -->
        <rect x="344" y="6" width="310" height="318" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
        <text x="364" y="34" fill="#0f172a" font-family="system-ui, sans-serif" font-size="14" font-weight="800">📄 Relatórios da Propriedade</text>
        <text x="364" y="54" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Exporte indicadores consolidados do período escolhido</text>

        <rect x="364" y="70" width="130" height="40" rx="8" fill="#dc2626"/>
        <text x="429" y="95" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700">⬇ Baixar PDF</text>

        <rect x="504" y="70" width="130" height="40" rx="8" fill="#0f766e"/>
        <text x="569" y="95" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700">📊 Baixar CSV</text>

        <rect x="364" y="124" width="270" height="178" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
        <text x="378" y="148" fill="#0f172a" font-family="system-ui, sans-serif" font-size="12" font-weight="800">Prévia do Relatório Consolidado:</text>
        <text x="378" y="170" fill="#334155" font-family="system-ui, sans-serif" font-size="11">• Rebanho ativo: 64 animais (28 vacas, 14 novilhas...)</text>
        <text x="378" y="190" fill="#334155" font-family="system-ui, sans-serif" font-size="11">• Leite no período: 6.420 L (Média 214 L/dia)</text>
        <text x="378" y="210" fill="#334155" font-family="system-ui, sans-serif" font-size="11">• Reprodução: 12 prenhas, 5 cobertas, 4 partos</text>
        <text x="378" y="230" fill="#334155" font-family="system-ui, sans-serif" font-size="11">• Vacinas em dia: 96% · Tratamentos no mês: 2</text>
        <text x="378" y="250" fill="#15803d" font-family="system-ui, sans-serif" font-size="11" font-weight="700">• Resultado Financeiro: + R$ 11.250,00</text>
      
    </g>
  </g>

  <!-- Callouts Overlay -->
  
    <g transform="translate(64, 195)">
      <circle cx="0" cy="0" r="15" fill="#dc2626" stroke="#ffffff" stroke-width="2.5" filter="url(#shadow)" />
      <text x="0" y="5" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800">1</text>
      
        <rect x="20" y="-13" width="172" height="26" rx="6" fill="#111827" opacity="0.92" />
        <text x="30" y="4" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600">Registrar Receita ou Despesa</text>
      
    </g>
  

    <g transform="translate(400, 155)">
      <circle cx="0" cy="0" r="15" fill="#dc2626" stroke="#ffffff" stroke-width="2.5" filter="url(#shadow)" />
      <text x="0" y="5" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800">2</text>
      
        <rect x="20" y="-13" width="158" height="26" rx="6" fill="#111827" opacity="0.92" />
        <text x="30" y="4" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600">Exportar PDF ou Planilha</text>
      
    </g>
  
</svg>