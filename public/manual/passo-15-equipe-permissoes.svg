    <text x="44" y="42" fill="#dcfce7" font-family="system-ui, sans-serif" font-size="11">Controle quem pode ver ou editar cada área da propriedade</text>
    <rect x="570" y="15" width="116" height="24" rx="12" fill="#ffffff" opacity="0.18"/>
    <text x="628" y="31" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Equipe & Acesso</text>

