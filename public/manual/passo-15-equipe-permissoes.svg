        <text x="30" y="62" fill="#334155" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">Nome: <tspan fill="#0f172a">Carlos Eduardo (Inseminador / Retireiro)</tspan>  ·  Telefone: <tspan fill="#0f172a">(35) 99811-2233</tspan></text>

        <text x="30" y="92" fill="#334155" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">Perfil de Acesso:</text>
        <rect x="30" y="100" width="120" height="32" rx="8" fill="#f1f5f9"/><text x="90" y="120" text-anchor="middle" fill="#475569" font-family="system-ui, sans-serif" font-size="11.5">Administrador</text>
        <rect x="160" y="100" width="120" height="32" rx="8" fill="#15803d"/><text x="220" y="120" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">✓ Editor</text>
        <rect x="290" y="100" width="120" height="32" rx="8" fill="#f1f5f9"/><text x="350" y="120" text-anchor="middle" fill="#475569" font-family="system-ui, sans-serif" font-size="11.5">Leitor</text>

        <text x="30" y="156" fill="#334155" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">Módulos Liberados para este Usuário:</text>

