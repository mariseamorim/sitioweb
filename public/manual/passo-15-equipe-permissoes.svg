        <text x="44" y="188" fill="#15803d" font-family="system-ui, sans-serif" font-size="12" font-weight="700">☑️ Animais e Recria</text>

        <rect x="232" y="166" width="190" height="34" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
        <text x="246" y="188" fill="#15803d" font-family="system-ui, sans-serif" font-size="12" font-weight="700">☑️ Produção de Leite</text>

        <rect x="434" y="166" width="190" height="34" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
        <text x="448" y="188" fill="#15803d" font-family="system-ui, sans-serif" font-size="12" font-weight="700">☑️ Reprodução</text>

        <rect x="30" y="210" width="190" height="34" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
        <text x="44" y="232" fill="#15803d" font-family="system-ui, sans-serif" font-size="12" font-weight="700">☑️ Vacinação e Tratamentos</text>

        <rect x="232" y="210" width="190" height="34" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
        <text x="246" y="232" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">⬜ Financeiro (Oculto)</text>

        <rect x="434" y="210" width="190" height="34" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
        <text x="448" y="232" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">⬜ Usuários (Oculto)</text>

        <rect x="30" y="264" width="594" height="40" rx="10" fill="#15803d"/>
        <text x="327" y="289" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Salvar Permissões do Usuário</text>
      
