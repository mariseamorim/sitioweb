<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#ecfdf5"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="760" height="460" rx="18" fill="url(#bgGrad)" stroke="#bbf7d0" stroke-width="1.5"/>

  <!-- Top Browser / App Frame -->
  <g transform="translate(28, 22)" filter="url(#shadow)">
    <rect width="704" height="416" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <!-- App Topbar -->
    <path d="M0 14 Q0 0 14 0 L690 0 Q704 0 704 14 L704 54 L0 54 Z" fill="#15803d"/>
    <!-- Brand Dot & Title -->
    <circle cx="24" cy="27" r="11" fill="#ffffff" opacity="0.2"/>
    <text x="24" y="31" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="800">🌱</text>
    <text x="44" y="25" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="800">Anota Aí Agro — Estoque de Insumos e Pedido de Orçamento</text>
    <text x="44" y="42" fill="#dcfce7" font-family="system-ui, sans-serif" font-size="11">Previsão de duração em dias pelo consumo dos lotes e cotação com fornecedores</text>
    <rect x="570" y="15" width="116" height="24" rx="12" fill="#ffffff" opacity="0.18"/>
    <text x="628" y="31" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Módulo Estoque</text>

    <!-- Screen Inner Content -->
    <g transform="translate(20, 68)">
      
        <rect x="10" y="6" width="644" height="318" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
        <text x="30" y="34" fill="#0f172a" font-family="system-ui, sans-serif" font-size="14" font-weight="800">📦 Posição Atual do Estoque</text>
        <rect x="490" y="16" width="144" height="30" rx="8" fill="#15803d"/>
        <text x="562" y="35" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">+ Cadastrar Produto</text>

        <!-- Item 1: Low stock -->
        <rect x="28" y="56" width="606" height="82" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
        <text x="44" y="80" fill="#991b1b" font-family="system-ui, sans-serif" font-size="13.5" font-weight="800">⚠️ Ração Lactação 22% (Sacos de 40 kg)</text>
        <text x="44" y="100" fill="#b91c1c" font-family="system-ui, sans-serif" font-size="11.5">Saldo atual: <tspan font-weight="800">3 sacos</tspan> (Mínimo: 10 sacos) · Preço: R$ 98,00/saco</text>
        <text x="44" y="120" fill="#7f1d1d" font-family="system-ui, sans-serif" font-size="11">🔥 2 ofertas ativas de fornecedores para Nutrição/Ração</text>
        <rect x="366" y="72" width="118" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
        <text x="425" y="93" text-anchor="middle" fill="#0f172a" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">+ Entrada / - Uso</text>
        <rect x="494" y="72" width="126" height="34" rx="8" fill="#dc2626"/>
        <text x="557" y="93" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">💬 Pedir Orçamento</text>

        <!-- Item 2: Days left warning -->
        <rect x="28" y="150" width="606" height="76" rx="10" fill="#fffbeb" stroke="#fcd34d"/>
        <text x="44" y="174" fill="#92400e" font-family="system-ui, sans-serif" font-size="13.5" font-weight="800">⏳ Proteinado Águas (Sacos de 30 kg)</text>
        <text x="44" y="194" fill="#b45309" font-family="system-ui, sans-serif" font-size="11.5">Saldo: <tspan font-weight="800">6 sacos (180 kg)</tspan> · Lotes consomem 33 kg/dia → <tspan font-weight="800">Acaba em 5 dias</tspan></text>
        <rect x="494" y="168" width="126" height="34" rx="8" fill="#d97706"/>
        <text x="557" y="189" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">💬 Pedir Orçamento</text>

        <!-- Item 3: OK -->
        <rect x="28" y="238" width="606" height="68" rx="10" fill="#f0fdf4" stroke="#86efac"/>
        <text x="44" y="262" fill="#14532d" font-family="system-ui, sans-serif" font-size="13.5" font-weight="800">✓ Sal Mineral Reprodução (Sacos de 25 kg)</text>
        <text x="44" y="282" fill="#166534" font-family="system-ui, sans-serif" font-size="11.5">Saldo: <tspan font-weight="800">18 sacos</tspan> (Mínimo: 5 sacos) · Estoque em dia</text>
      
    </g>
  </g>

  <!-- Callouts Overlay -->
  
    <g transform="translate(420, 155)">
      <circle cx="0" cy="0" r="15" fill="#dc2626" stroke="#ffffff" stroke-width="2.5" filter="url(#shadow)" />
      <text x="0" y="5" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800">1</text>
      
        <rect x="20" y="-13" width="162" height="26" rx="6" fill="#111827" opacity="0.92" />
        <text x="30" y="4" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600">Registrar entrada ou saída</text>
      
    </g>
  

    <g transform="translate(540, 155)">
      <circle cx="0" cy="0" r="15" fill="#dc2626" stroke="#ffffff" stroke-width="2.5" filter="url(#shadow)" />
      <text x="0" y="5" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800">2</text>
      
        <rect x="20" y="-13" width="145" height="26" rx="6" fill="#111827" opacity="0.92" />
        <text x="30" y="4" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600">Cotar com fornecedor</text>
      
    </g>
  

    <g transform="translate(240, 260)">
      <circle cx="0" cy="0" r="15" fill="#dc2626" stroke="#ffffff" stroke-width="2.5" filter="url(#shadow)" />
      <text x="0" y="5" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800">3</text>
      
        <rect x="20" y="-13" width="195" height="26" rx="6" fill="#111827" opacity="0.92" />
        <text x="30" y="4" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600">Previsão em dias (consumo lotes)</text>
      
    </g>
  
</svg>