<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#ecfdf5"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="760" height="460" rx="18" fill="url(#bgGrad)" stroke="#bbf7d0" stroke-width="1.5"/>

  <!-- Top Browser / App Frame -->
  <g transform="translate(28, 22)" filter="url(#shadow)">
    <rect width="704" height="416" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <!-- App Topbar -->
    <path d="M0 14 Q0 0 14 0 L690 0 Q704 0 704 14 L704 54 L0 54 Z" fill="#0f766e"/>
    <!-- Brand Dot & Title -->
    <circle cx="24" cy="27" r="11" fill="#ffffff" opacity="0.2"/>
    <text x="24" y="31" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="800">🌱</text>
    <text x="44" y="25" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="800">Anota Aí Agro — Modo Offline e Sincronização</text>
    <text x="44" y="42" fill="#dcfce7" font-family="system-ui, sans-serif" font-size="11">Fila local segura no aparelho com envio automático</text>
    <rect x="570" y="15" width="116" height="24" rx="12" fill="#ffffff" opacity="0.18"/>
    <text x="628" y="31" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Funciona Sem Sinal</text>

    <!-- Screen Inner Content -->
    <g transform="translate(20, 68)">
      
        <!-- Banner Offline -->
        <rect x="10" y="6" width="644" height="48" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
        <text x="30" y="27" fill="#92400e" font-family="system-ui, sans-serif" font-size="13" font-weight="800">📡 Você está sem internet — Modo Offline Ativo</text>
        <text x="30" y="44" fill="#b45309" font-family="system-ui, sans-serif" font-size="11.5">3 anotações guardadas no celular. Elas serão enviadas automaticamente quando o sinal voltar.</text>
        <rect x="515" y="14" width="126" height="32" rx="8" fill="#d97706"/>
        <text x="578" y="34" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">↻ Sincronizar (3)</text>

        <!-- Queue items -->
        <rect x="10" y="68" width="644" height="256" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
        <text x="30" y="96" fill="#0f172a" font-family="system-ui, sans-serif" font-size="14" font-weight="800">Registros salvos no aparelho (aguardando sinal)</text>

        <g transform="translate(26, 112)">
          <rect width="612" height="54" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
          <text x="18" y="24" fill="#0f172a" font-family="system-ui, sans-serif" font-size="13" font-weight="700">🥛 Leite do dia — Sítio São José: 185,5 L</text>
          <text x="18" y="42" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Hoje às 06:40 · Guardado no celular</text>
          <rect x="506" y="15" width="90" height="24" rx="12" fill="#fef3c7" stroke="#f59e0b"/>
          <text x="551" y="31" text-anchor="middle" fill="#92400e" font-family="system-ui, sans-serif" font-size="11" font-weight="700">⏳ Na fila</text>
        </g>

        <g transform="translate(26, 176)">
          <rect width="612" height="54" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
          <text x="18" y="24" fill="#0f172a" font-family="system-ui, sans-serif" font-size="13" font-weight="700">🐄 Cobertura (IATF) — Mimosa (04) · Touro Netuno</text>
          <text x="18" y="42" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Hoje às 08:15 · Guardado no celular</text>
          <rect x="506" y="15" width="90" height="24" rx="12" fill="#fef3c7" stroke="#f59e0b"/>
          <text x="551" y="31" text-anchor="middle" fill="#92400e" font-family="system-ui, sans-serif" font-size="11" font-weight="700">⏳ Na fila</text>
        </g>

        <g transform="translate(26, 240)">
          <rect width="612" height="54" rx="10" fill="#f0fdf4" stroke="#86efac"/>
          <text x="18" y="24" fill="#14532d" font-family="system-ui, sans-serif" font-size="13" font-weight="700">⚖️ Pesagem Recria — Bezerra Estrela (12): 198 kg (+0,72 kg/dia)</text>
          <text x="18" y="42" fill="#166534" font-family="system-ui, sans-serif" font-size="11">Sincronizado com sucesso quando o sinal voltou</text>
          <rect x="506" y="15" width="90" height="24" rx="12" fill="#dcfce7" stroke="#22c55e"/>
          <text x="551" y="31" text-anchor="middle" fill="#15803d" font-family="system-ui, sans-serif" font-size="11" font-weight="700">✓ Enviado</text>
        </g>
      
    </g>
  </g>

  <!-- Callouts Overlay -->
  
    <g transform="translate(40, 112)">
      <circle cx="0" cy="0" r="15" fill="#dc2626" stroke="#ffffff" stroke-width="2.5" filter="url(#shadow)" />
      <text x="0" y="5" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800">1</text>
      
        <rect x="20" y="-13" width="155" height="26" rx="6" fill="#111827" opacity="0.92" />
        <text x="30" y="4" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600">Aviso de modo sem sinal</text>
      
    </g>
  

    <g transform="translate(520, 215)">
      <circle cx="0" cy="0" r="15" fill="#dc2626" stroke="#ffffff" stroke-width="2.5" filter="url(#shadow)" />
      <text x="0" y="5" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800">2</text>
      
        <rect x="20" y="-13" width="125" height="26" rx="6" fill="#111827" opacity="0.92" />
        <text x="30" y="4" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600">Marcado "Na fila"</text>
      
    </g>
  

    <g transform="translate(540, 112)">
      <circle cx="0" cy="0" r="15" fill="#dc2626" stroke="#ffffff" stroke-width="2.5" filter="url(#shadow)" />
      <text x="0" y="5" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800">3</text>
      
        <rect x="20" y="-13" width="165" height="26" rx="6" fill="#111827" opacity="0.92" />
        <text x="30" y="4" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600">Envia sozinho ou ao tocar</text>
      
    </g>
  
</svg>