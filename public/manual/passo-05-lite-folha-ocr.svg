<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#ecfdf5"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="760" height="460" rx="18" fill="url(#bgGrad)" stroke="#bbf7d0" stroke-width="1.5"/>

  <!-- Top Browser / App Frame -->
  <g transform="translate(28, 22)" filter="url(#shadow)">
    <rect width="704" height="416" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <!-- App Topbar -->
    <path d="M0 14 Q0 0 14 0 L690 0 Q704 0 704 14 L704 54 L0 54 Z" fill="#15803d"/>
    <!-- Brand Dot & Title -->
    <circle cx="24" cy="27" r="11" fill="#ffffff" opacity="0.2"/>
    <text x="24" y="31" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="800">🌱</text>
    <text x="44" y="25" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="800">Anota Aí Agro — Leitura da Folha do Motorista por Foto (OCR)</text>
    <text x="44" y="42" fill="#dcfce7" font-family="system-ui, sans-serif" font-size="11">Extrai litros, temperatura, amostra e régua e guarda a foto como prova</text>
    <rect x="570" y="15" width="116" height="24" rx="12" fill="#ffffff" opacity="0.18"/>
    <text x="628" y="31" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Leitura por Foto</text>

    <!-- Screen Inner Content -->
    <g transform="translate(20, 68)">
      
        <!-- Left: Camera / Photo preview -->
        <rect x="10" y="6" width="250" height="318" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
        <text x="26" y="32" fill="#0f172a" font-family="system-ui, sans-serif" font-size="13" font-weight="800">📷 Foto da Folha</text>
        <rect x="26" y="44" width="218" height="190" rx="8" fill="#fefce8" stroke="#fde047" stroke-width="1.5"/>
        <text x="40" y="68" fill="#713f12" font-family="monospace" font-size="10" font-weight="700">LATICÍNIO VALE VERDE - ROTA 04</text>
        <line x1="36" y1="74" x2="234" y2="74" stroke="#ca8a04"/>
        <text x="40" y="94" fill="#422006" font-family="monospace" font-size="10">Cód 4812 JOÃO SILVA:   222 L</text>
        <text x="40" y="112" fill="#422006" font-family="monospace" font-size="10">Cód 4813 MARIA SILVA:  148 L</text>
        <line x1="36" y1="124" x2="234" y2="124" stroke="#ca8a04"/>
        <text x="40" y="144" fill="#15803d" font-family="monospace" font-size="11" font-weight="700">TOTAL COLETADO: 370 L</text>
        <text x="40" y="166" fill="#422006" font-family="monospace" font-size="10">Temp: 3,4 °C | Amostra: 884</text>
        <text x="40" y="184" fill="#422006" font-family="monospace" font-size="10">Régua: 41,2 cm</text>
        <rect x="26" y="248" width="218" height="34" rx="8" fill="#15803d"/>
        <text x="135" y="270" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700">📸 Fotografar Folha</text>
        <text x="135" y="304" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="10.5">Foto salva junto da coleta (600 KB)</text>

        <!-- Right: Extracted fields & comparison -->
        <rect x="274" y="6" width="380" height="318" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
        <text x="294" y="34" fill="#0f172a" font-family="system-ui, sans-serif" font-size="14" font-weight="800">Dados Lidos da Folha (Confira antes de salvar)</text>

        <rect x="294" y="48" width="164" height="52" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
        <text x="306" y="66" fill="#64748b" font-family="system-ui, sans-serif" font-size="10.5">Total na Folha</text>
        <text x="306" y="88" fill="#0f172a" font-family="system-ui, sans-serif" font-size="16" font-weight="800">370 L</text>

        <rect x="470" y="48" width="164" height="52" rx="8" fill="#f0fdf4" stroke="#86efac"/>
        <text x="482" y="66" fill="#166534" font-family="system-ui, sans-serif" font-size="10.5">Seu Anotado no Sítio</text>
        <text x="482" y="88" fill="#15803d" font-family="system-ui, sans-serif" font-size="16" font-weight="800">370 L (Bateu ✓)</text>

        <rect x="294" y="112" width="108" height="48" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
        <text x="306" y="130" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Temperatura</text>
        <text x="306" y="149" fill="#0f172a" font-family="system-ui, sans-serif" font-size="13" font-weight="700">3,4 °C</text>

        <rect x="412" y="112" width="108" height="48" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
        <text x="424" y="130" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Nº Amostra</text>
        <text x="424" y="149" fill="#0f172a" font-family="system-ui, sans-serif" font-size="13" font-weight="700">884</text>

        <rect x="530" y="112" width="104" height="48" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
        <text x="542" y="130" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Régua</text>
        <text x="542" y="149" fill="#0f172a" font-family="system-ui, sans-serif" font-size="13" font-weight="700">41,2 cm</text>

        <rect x="294" y="174" width="340" height="82" rx="8" fill="#fef2f2" stroke="#fecaca"/>
        <text x="308" y="196" fill="#991b1b" font-family="system-ui, sans-serif" font-size="11.5" font-weight="800">⚠️ Exemplo de Alerta quando há divergência (&gt; 5%):</text>
        <text x="308" y="216" fill="#b91c1c" font-family="system-ui, sans-serif" font-size="11">Dia 14/11: Anotado 380 L · Folha 345 L (-35 L / -9,2%)</text>
        <text x="308" y="236" fill="#7f1d1d" font-family="system-ui, sans-serif" font-size="10.5">Toque em "Ver Foto" no histórico para mostrar o comprovante ao laticínio.</text>

        <rect x="294" y="270" width="340" height="38" rx="10" fill="#15803d"/>
        <text x="464" y="294" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Salvar Folha e Comprovante</text>
      
    </g>
  </g>

  <!-- Callouts Overlay -->
  
    <g transform="translate(64, 345)">
      <circle cx="0" cy="0" r="15" fill="#dc2626" stroke="#ffffff" stroke-width="2.5" filter="url(#shadow)" />
      <text x="0" y="5" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800">1</text>
      
        <rect x="20" y="-13" width="128" height="26" rx="6" fill="#111827" opacity="0.92" />
        <text x="30" y="4" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600">Tire foto da folha</text>
      
    </g>
  

    <g transform="translate(325, 145)">
      <circle cx="0" cy="0" r="15" fill="#dc2626" stroke="#ffffff" stroke-width="2.5" filter="url(#shadow)" />
      <text x="0" y="5" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800">2</text>
      
        <rect x="20" y="-13" width="165" height="26" rx="6" fill="#111827" opacity="0.92" />
        <text x="30" y="4" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600">Litros, temp. e régua lidos</text>
      
    </g>
  

    <g transform="translate(345, 372)">
      <circle cx="0" cy="0" r="15" fill="#dc2626" stroke="#ffffff" stroke-width="2.5" filter="url(#shadow)" />
      <text x="0" y="5" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800">3</text>
      
        <rect x="20" y="-13" width="158" height="26" rx="6" fill="#111827" opacity="0.92" />
        <text x="30" y="4" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600">Salva folha + foto prova</text>
      
    </g>
  
</svg>