        <text x="376" y="108" fill="#3b82f6" font-family="system-ui, sans-serif" font-size="10.5">Enviado para 54 associados ativos</text>

        <text x="364" y="168" fill="#0f172a" font-family="system-ui, sans-serif" font-size="13" font-weight="800">💳 Mensalidades — Ref. 2026-11 (R$ 45,00)</text>
