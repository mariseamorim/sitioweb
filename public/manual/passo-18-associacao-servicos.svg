        <text x="28" y="190" fill="#0f172a" font-family="system-ui, sans-serif" font-size="13.5" font-weight="800">🩺 Assistência Técnica</text>
        <rect x="26" y="202" width="288" height="106" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
