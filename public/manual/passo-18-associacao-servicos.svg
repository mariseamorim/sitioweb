        <text x="40" y="88" fill="#166534" font-family="system-ui, sans-serif" font-size="11">Prazo até 25/11 · 18 associados já pediram</text>
        <text x="40" y="112" fill="#15803d" font-family="system-ui, sans-serif" font-size="16" font-weight="800">Total reunido: 420 sacos</text>
        <rect x="40" y="124" width="260" height="28" rx="6" fill="#15803d"/>
