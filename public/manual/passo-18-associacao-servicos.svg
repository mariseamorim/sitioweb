        <text x="376" y="220" fill="#166534" font-family="system-ui, sans-serif" font-size="10.5">48 de 54 associados em dia neste mês</text>

        <rect x="362" y="244" width="274" height="62" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
        <text x="376" y="266" fill="#0f172a" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">🔗 Link de Convite da Associação:</text>
        <text x="376" y="286" fill="#15803d" font-family="system-ui, sans-serif" font-size="11" font-weight="700">📲 Compartilhar convite no WhatsApp</text>
      
