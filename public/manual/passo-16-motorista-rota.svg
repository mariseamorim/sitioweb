<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#ecfdf5"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="760" height="460" rx="18" fill="url(#bgGrad)" stroke="#bbf7d0" stroke-width="1.5"/>

  <!-- Top Browser / App Frame -->
  <g transform="translate(28, 22)" filter="url(#shadow)">
    <rect width="704" height="416" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <!-- App Topbar -->
    <path d="M0 14 Q0 0 14 0 L690 0 Q704 0 704 14 L704 54 L0 54 Z" fill="#0369a1"/>
    <!-- Brand Dot & Title -->
    <circle cx="24" cy="27" r="11" fill="#ffffff" opacity="0.2"/>
    <text x="24" y="31" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="800">🌱</text>
    <text x="44" y="25" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="800">Anota Aí Agro — Rota do Motorista — Paradas de Hoje</text>
    <text x="44" y="42" fill="#dcfce7" font-family="system-ui, sans-serif" font-size="11">Linha 02 Sul · 12 paradas (9 coletadas, 2 pendentes, 1 não coletada)</text>
    <rect x="570" y="15" width="116" height="24" rx="12" fill="#ffffff" opacity="0.18"/>
    <text x="628" y="31" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700">App do Motorista</text>

    <!-- Screen Inner Content -->
    <g transform="translate(20, 68)">
      
        <rect x="10" y="6" width="644" height="318" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
        <text x="30" y="34" fill="#0f172a" font-family="system-ui, sans-serif" font-size="14" font-weight="800">🚚 Paradas da Rota de Hoje — Terça-feira (17/11)</text>

        <!-- Stop 1: Done -->
        <rect x="28" y="48" width="608" height="58" rx="10" fill="#f0fdf4" stroke="#86efac"/>
        <text x="44" y="72" fill="#14532d" font-family="system-ui, sans-serif" font-size="13" font-weight="800">Parada 1 · Sítio Boa Vista (João Silva) — ✓ Coletado: 370 L</text>
        <text x="44" y="92" fill="#166534" font-family="system-ui, sans-serif" font-size="11">Coletado às 07:15 · Tanque 500 L</text>

        <!-- Stop 2: Current -->
        <rect x="28" y="116" width="608" height="122" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
        <text x="44" y="140" fill="#1e3a8a" font-family="system-ui, sans-serif" font-size="13.5" font-weight="800">Parada 2 (Agora) · Fazenda Santa Clara — Tanque 1.000 L</text>
        <text x="44" y="158" fill="#1d4ed8" font-family="system-ui, sans-serif" font-size="11">📍 Estrada do Cervo, km 4 · ⚠️ Porteira azul à direita (cadeado 1234)</text>

        <rect x="44" y="172" width="180" height="44" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
        <text x="60" y="200" fill="#0f172a" font-family="system-ui, sans-serif" font-size="18" font-weight="800">490,0 L</text>

        <rect x="236" y="172" width="190" height="44" rx="8" fill="#15803d"/>
        <text x="331" y="199" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="800">✓ Salvar Coleta</text>

        <rect x="438" y="172" width="180" height="44" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
        <text x="528" y="199" text-anchor="middle" fill="#dc2626" font-family="system-ui, sans-serif" font-size="12" font-weight="700">✕ Não Coletei (Motivo)</text>

        <!-- Stop 3: Skipped -->
        <rect x="28" y="248" width="608" height="58" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
        <text x="44" y="272" fill="#991b1b" font-family="system-ui, sans-serif" font-size="13" font-weight="800">Parada 3 · Sítio Córrego Fundo — ✕ Não coletado (0 L)</text>
        <text x="44" y="292" fill="#b91c1c" font-family="system-ui, sans-serif" font-size="11">Motivo registrado: Leite ácido no teste do alizarol</text>
      
    </g>
  </g>

  <!-- Callouts Overlay -->
  
    <g transform="translate(64, 220)">
      <circle cx="0" cy="0" r="15" fill="#dc2626" stroke="#ffffff" stroke-width="2.5" filter="url(#shadow)" />
      <text x="0" y="5" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800">1</text>
      
        <rect x="20" y="-13" width="138" height="26" rx="6" fill="#111827" opacity="0.92" />
        <text x="30" y="4" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600">Instruções de acesso</text>
      
    </g>
  

    <g transform="translate(265, 255)">
      <circle cx="0" cy="0" r="15" fill="#dc2626" stroke="#ffffff" stroke-width="2.5" filter="url(#shadow)" />
      <text x="0" y="5" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800">2</text>
      
        <rect x="20" y="-13" width="155" height="26" rx="6" fill="#111827" opacity="0.92" />
        <text x="30" y="4" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600">Informe os litros e salve</text>
      
    </g>
  

    <g transform="translate(465, 255)">
      <circle cx="0" cy="0" r="15" fill="#dc2626" stroke="#ffffff" stroke-width="2.5" filter="url(#shadow)" />
      <text x="0" y="5" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800">3</text>
      
        <rect x="20" y="-13" width="192" height="26" rx="6" fill="#111827" opacity="0.92" />
        <text x="30" y="4" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600">Ou registre motivo de não coleta</text>
      
    </g>
  
</svg>