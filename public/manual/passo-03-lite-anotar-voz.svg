<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#ecfdf5"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="760" height="460" rx="18" fill="url(#bgGrad)" stroke="#bbf7d0" stroke-width="1.5"/>

  <!-- Top Browser / App Frame -->
  <g transform="translate(28, 22)" filter="url(#shadow)">
    <rect width="704" height="416" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <!-- App Topbar -->
    <path d="M0 14 Q0 0 14 0 L690 0 Q704 0 704 14 L704 54 L0 54 Z" fill="#15803d"/>
    <!-- Brand Dot & Title -->
    <circle cx="24" cy="27" r="11" fill="#ffffff" opacity="0.2"/>
    <text x="24" y="31" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="800">🌱</text>
    <text x="44" y="25" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="800">Anota Aí Agro — Anota Aí Leite — Anotar Leite do Dia</text>
    <text x="44" y="42" fill="#dcfce7" font-family="system-ui, sans-serif" font-size="11">Lançamento rápido por teclado ou comando de voz offline</text>
    <rect x="570" y="15" width="116" height="24" rx="12" fill="#ffffff" opacity="0.18"/>
    <text x="628" y="31" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700">100% Gratuito</text>

    <!-- Screen Inner Content -->
    <g transform="translate(20, 68)">
      
        <!-- Tabs -->
        <rect x="10" y="2" width="644" height="38" rx="10" fill="#e2e8f0"/>
        <rect x="14" y="6" width="155" height="30" rx="8" fill="#15803d"/>
        <text x="91" y="25" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700">🥛 Anotar</text>
        <text x="248" y="25" text-anchor="middle" fill="#475569" font-family="system-ui, sans-serif" font-size="12" font-weight="600">📄 Folha (Foto)</text>
        <text x="405" y="25" text-anchor="middle" fill="#475569" font-family="system-ui, sans-serif" font-size="12" font-weight="600">👥 Nomes da Nota</text>
        <text x="565" y="25" text-anchor="middle" fill="#475569" font-family="system-ui, sans-serif" font-size="12" font-weight="600">📊 Histórico</text>

        <!-- Main input card -->
        <rect x="10" y="50" width="400" height="276" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
        <text x="30" y="80" fill="#0f172a" font-family="system-ui, sans-serif" font-size="15" font-weight="800">Leite de hoje — Sítio Boa Vista</text>
        <text x="30" y="100" fill="#64748b" font-family="system-ui, sans-serif" font-size="11.5">Data: 17/11/2026</text>

        <text x="30" y="132" fill="#334155" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Litros produzidos no dia</text>
        <rect x="30" y="140" width="230" height="56" rx="12" fill="#f8fafc" stroke="#16a34a" stroke-width="2"/>
        <text x="48" y="177" fill="#0f172a" font-family="system-ui, sans-serif" font-size="26" font-weight="800">185,5 L</text>

        <!-- Voice button -->
        <rect x="272" y="140" width="118" height="56" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
        <text x="331" y="165" text-anchor="middle" fill="#15803d" font-family="system-ui, sans-serif" font-size="15" font-weight="800">🎙️ Falar</text>
        <text x="331" y="183" text-anchor="middle" fill="#166534" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600">Voz offline</text>

        <rect x="30" y="214" width="360" height="46" rx="10" fill="#15803d"/>
        <text x="210" y="242" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="800">Salvar Leite do Dia</text>

        <text x="30" y="292" fill="#475569" font-family="system-ui, sans-serif" font-size="11.5">Preço do litro: <tspan font-weight="700" fill="#0f172a">R$ 2,65/L</tspan>  ·  <tspan fill="#15803d" font-weight="700">Alterar preço</tspan></text>

        <!-- Right summary card -->
        <rect x="426" y="50" width="228" height="276" rx="12" fill="#f0fdf4" stroke="#86efac"/>
        <text x="446" y="82" fill="#14532d" font-family="system-ui, sans-serif" font-size="13" font-weight="800">Resumo de Novembro</text>
        <text x="446" y="122" fill="#166534" font-family="system-ui, sans-serif" font-size="11">Total acumulado no mês</text>
        <text x="446" y="152" fill="#14532d" font-family="system-ui, sans-serif" font-size="26" font-weight="800">3.140 L</text>

        <line x1="446" y1="174" x2="634" y2="174" stroke="#bbf7d0" stroke-width="1.5"/>

        <text x="446" y="202" fill="#166534" font-family="system-ui, sans-serif" font-size="11">Valor estimado a receber</text>
        <text x="446" y="232" fill="#15803d" font-family="system-ui, sans-serif" font-size="24" font-weight="800">R$ 8.321,00</text>
        <text x="446" y="256" fill="#166534" font-family="system-ui, sans-serif" font-size="11">Média: 184,7 L/dia (17 dias)</text>
      
    </g>
  </g>

  <!-- Callouts Overlay -->
  
    <g transform="translate(75, 242)">
      <circle cx="0" cy="0" r="15" fill="#dc2626" stroke="#ffffff" stroke-width="2.5" filter="url(#shadow)" />
      <text x="0" y="5" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800">1</text>
      
        <rect x="20" y="-13" width="112" height="26" rx="6" fill="#111827" opacity="0.92" />
        <text x="30" y="4" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600">Digite os litros</text>
      
    </g>
  

    <g transform="translate(350, 215)">
      <circle cx="0" cy="0" r="15" fill="#dc2626" stroke="#ffffff" stroke-width="2.5" filter="url(#shadow)" />
      <text x="0" y="5" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800">2</text>
      
        <rect x="20" y="-13" width="145" height="26" rx="6" fill="#111827" opacity="0.92" />
        <text x="30" y="4" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600">Ou fale no microfone</text>
      
    </g>
  

    <g transform="translate(75, 325)">
      <circle cx="0" cy="0" r="15" fill="#dc2626" stroke="#ffffff" stroke-width="2.5" filter="url(#shadow)" />
      <text x="0" y="5" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800">3</text>
      
        <rect x="20" y="-13" width="118" height="26" rx="6" fill="#111827" opacity="0.92" />
        <text x="30" y="4" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600">Toque em Salvar</text>
      
    </g>
  
</svg>