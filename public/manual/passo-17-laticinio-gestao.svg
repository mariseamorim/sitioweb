<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#ecfdf5"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="760" height="460" rx="18" fill="url(#bgGrad)" stroke="#bbf7d0" stroke-width="1.5"/>

  <!-- Top Browser / App Frame -->
  <g transform="translate(28, 22)" filter="url(#shadow)">
    <rect width="704" height="416" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <!-- App Topbar -->
    <path d="M0 14 Q0 0 14 0 L690 0 Q704 0 704 14 L704 54 L0 54 Z" fill="#1e3a8a"/>
    <!-- Brand Dot & Title -->
    <circle cx="24" cy="27" r="11" fill="#ffffff" opacity="0.2"/>
    <text x="24" y="31" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="800">🌱</text>
    <text x="44" y="25" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="800">Anota Aí Agro — Painel do Laticínio — Coleta & Recepção</text>
    <text x="44" y="42" fill="#dcfce7" font-family="system-ui, sans-serif" font-size="11">Conferência de ponta a ponta: Sítio × Caminhão × Plataforma</text>
    <rect x="570" y="15" width="116" height="24" rx="12" fill="#ffffff" opacity="0.18"/>
    <text x="628" y="31" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Portal Laticínio</text>

    <!-- Screen Inner Content -->
    <g transform="translate(20, 68)">
      
        <!-- Top tabs -->
        <rect x="10" y="4" width="644" height="36" rx="8" fill="#e2e8f0"/>
        <rect x="14" y="8" width="118" height="28" rx="6" fill="#1e3a8a"/>
        <text x="73" y="26" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">📍 Hoje &amp; Recepção</text>
        <text x="195" y="26" text-anchor="middle" fill="#475569" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600">🗺️ Rotas (4)</text>
        <text x="315" y="26" text-anchor="middle" fill="#475569" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600">🏡 Pontos (48)</text>
        <text x="445" y="26" text-anchor="middle" fill="#475569" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600">🚚 Motoristas (5)</text>
        <text x="580" y="26" text-anchor="middle" fill="#475569" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600">📋 Histórico</text>

        <rect x="10" y="50" width="644" height="274" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
        <text x="30" y="78" fill="#0f172a" font-family="system-ui, sans-serif" font-size="14" font-weight="800">Conferência de Recepção por Rota — Hoje (17/11/2026)</text>

        <!-- Route 1 comparison -->
        <rect x="28" y="94" width="608" height="96" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
        <text x="44" y="118" fill="#0f172a" font-family="system-ui, sans-serif" font-size="13" font-weight="800">Rota 01 Norte — Motorista: Marcos (Placa ABC-1D23) · 14/14 paradas concluídas</text>

        <rect x="44" y="130" width="175" height="46" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
        <text x="56" y="148" fill="#64748b" font-family="system-ui, sans-serif" font-size="10.5">Anotado pelos Produtores</text>
        <text x="56" y="168" fill="#0f172a" font-family="system-ui, sans-serif" font-size="15" font-weight="800">4.120 L</text>

        <rect x="232" y="130" width="175" height="46" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
        <text x="244" y="148" fill="#1e40af" font-family="system-ui, sans-serif" font-size="10.5">Coletado pelo Motorista</text>
        <text x="244" y="168" fill="#1d4ed8" font-family="system-ui, sans-serif" font-size="15" font-weight="800">4.115 L</text>

        <rect x="420" y="130" width="200" height="46" rx="8" fill="#f0fdf4" stroke="#86efac"/>
        <text x="432" y="148" fill="#166534" font-family="system-ui, sans-serif" font-size="10.5">Recebido na Plataforma</text>
        <text x="432" y="168" fill="#15803d" font-family="system-ui, sans-serif" font-size="15" font-weight="800">4.112 L (-0,07% ✓)</text>

        <!-- Reception input -->
        <rect x="28" y="204" width="608" height="102" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
        <text x="44" y="228" fill="#0f172a" font-family="system-ui, sans-serif" font-size="13" font-weight="800">Registrar Descarga na Plataforma — Rota 02 Sul (Coletado: 3.480 L)</text>
        <rect x="44" y="244" width="220" height="42" rx="8" fill="#ffffff" stroke="#1e3a8a" stroke-width="1.5"/>
        <text x="60" y="270" fill="#0f172a" font-family="system-ui, sans-serif" font-size="15" font-weight="800">3.475 L</text>
        <rect x="278" y="244" width="210" height="42" rx="8" fill="#1e3a8a"/>
        <text x="383" y="270" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700">✓ Salvar Recepção da Rota</text>
      
    </g>
  </g>

  <!-- Callouts Overlay -->
  
    <g transform="translate(185, 82)">
      <circle cx="0" cy="0" r="15" fill="#dc2626" stroke="#ffffff" stroke-width="2.5" filter="url(#shadow)" />
      <text x="0" y="5" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800">1</text>
      
        <rect x="20" y="-13" width="205" height="26" rx="6" fill="#111827" opacity="0.92" />
        <text x="30" y="4" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600">Gerencie Rotas, Pontos e Motoristas</text>
      
    </g>
  

    <g transform="translate(455, 200)">
      <circle cx="0" cy="0" r="15" fill="#dc2626" stroke="#ffffff" stroke-width="2.5" filter="url(#shadow)" />
      <text x="0" y="5" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800">2</text>
      
        <rect x="20" y="-13" width="225" height="26" rx="6" fill="#111827" opacity="0.92" />
        <text x="30" y="4" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600">Comparação Produtor × Rota × Recebido</text>
      
    </g>
  

    <g transform="translate(310, 332)">
      <circle cx="0" cy="0" r="15" fill="#dc2626" stroke="#ffffff" stroke-width="2.5" filter="url(#shadow)" />
      <text x="0" y="5" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800">3</text>
      
        <rect x="20" y="-13" width="155" height="26" rx="6" fill="#111827" opacity="0.92" />
        <text x="30" y="4" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600">Lance o volume recebido</text>
      
    </g>
  
</svg>