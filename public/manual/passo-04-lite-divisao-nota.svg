<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#ecfdf5"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="760" height="460" rx="18" fill="url(#bgGrad)" stroke="#bbf7d0" stroke-width="1.5"/>

  <!-- Top Browser / App Frame -->
  <g transform="translate(28, 22)" filter="url(#shadow)">
    <rect width="704" height="416" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <!-- App Topbar -->
    <path d="M0 14 Q0 0 14 0 L690 0 Q704 0 704 14 L704 54 L0 54 Z" fill="#15803d"/>
    <!-- Brand Dot & Title -->
    <circle cx="24" cy="27" r="11" fill="#ffffff" opacity="0.2"/>
    <text x="24" y="31" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="800">🌱</text>
    <text x="44" y="25" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="800">Anota Aí Agro — Divisão da Nota no Dia da Coleta</text>
    <text x="44" y="42" fill="#dcfce7" font-family="system-ui, sans-serif" font-size="11">Mais de um código de produtor no mesmo tanque</text>
    <rect x="570" y="15" width="116" height="24" rx="12" fill="#ffffff" opacity="0.18"/>
    <text x="628" y="31" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Nota Dividida</text>

    <!-- Screen Inner Content -->
    <g transform="translate(20, 68)">
      
        <rect x="10" y="6" width="644" height="318" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
        <text x="30" y="36" fill="#0f172a" font-family="system-ui, sans-serif" font-size="15" font-weight="800">🚛 Coleta hoje? Dividir a nota do tanque</text>
        <text x="30" y="56" fill="#64748b" font-family="system-ui, sans-serif" font-size="11.5">Litros acumulados desde a última coleta (16/11 a 17/11): <tspan fill="#0f172a" font-weight="800">370 L</tspan></text>

        <!-- Quick split buttons -->
        <text x="30" y="86" fill="#334155" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Preenchimento rápido:</text>
        <rect x="30" y="94" width="168" height="30" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
        <text x="114" y="113" text-anchor="middle" fill="#15803d" font-family="system-ui, sans-serif" font-size="11" font-weight="700">⚡ Como da última (60/40%)</text>
        <rect x="208" y="94" width="136" height="30" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
        <text x="276" y="113" text-anchor="middle" fill="#334155" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Igual (185 / 185 L)</text>
        <rect x="354" y="94" width="144" height="30" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
        <text x="426" y="113" text-anchor="middle" fill="#334155" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Tudo no 1º nome</text>

        <!-- Payee 1 -->
        <rect x="30" y="140" width="604" height="54" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
        <text x="48" y="164" fill="#0f172a" font-family="system-ui, sans-serif" font-size="13" font-weight="700">1. João da Silva (Cód. 4812 · Seq. 08)</text>
        <text x="48" y="182" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">60% da coleta</text>
        <rect x="460" y="150" width="154" height="34" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
        <text x="537" y="172" text-anchor="middle" fill="#0f172a" font-family="system-ui, sans-serif" font-size="14" font-weight="800">222 L</text>

        <!-- Payee 2 -->
        <rect x="30" y="204" width="604" height="54" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
        <text x="48" y="228" fill="#0f172a" font-family="system-ui, sans-serif" font-size="13" font-weight="700">2. Maria Aparecida Silva (Cód. 4813 · Seq. 09)</text>
        <text x="48" y="246" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">40% da coleta (completado automaticamente)</text>
        <rect x="460" y="214" width="154" height="34" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
        <text x="537" y="236" text-anchor="middle" fill="#0f172a" font-family="system-ui, sans-serif" font-size="14" font-weight="800">148 L</text>

        <!-- Save -->
        <rect x="30" y="270" width="604" height="40" rx="10" fill="#15803d"/>
        <text x="332" y="295" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="800">✓ Salvar Divisão da Coleta (Soma: 370 L)</text>
      
    </g>
  </g>

  <!-- Callouts Overlay -->
  
    <g transform="translate(64, 192)">
      <circle cx="0" cy="0" r="15" fill="#dc2626" stroke="#ffffff" stroke-width="2.5" filter="url(#shadow)" />
      <text x="0" y="5" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800">1</text>
      
        <rect x="20" y="-13" width="145" height="26" rx="6" fill="#111827" opacity="0.92" />
        <text x="30" y="4" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600">Sugestão com 1 toque</text>
      
    </g>
  

    <g transform="translate(495, 245)">
      <circle cx="0" cy="0" r="15" fill="#dc2626" stroke="#ffffff" stroke-width="2.5" filter="url(#shadow)" />
      <text x="0" y="5" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800">2</text>
      
        <rect x="20" y="-13" width="138" height="26" rx="6" fill="#111827" opacity="0.92" />
        <text x="30" y="4" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600">Litros de cada nome</text>
      
    </g>
  

    <g transform="translate(185, 376)">
      <circle cx="0" cy="0" r="15" fill="#dc2626" stroke="#ffffff" stroke-width="2.5" filter="url(#shadow)" />
      <text x="0" y="5" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800">3</text>
      
        <rect x="20" y="-13" width="160" height="26" rx="6" fill="#111827" opacity="0.92" />
        <text x="30" y="4" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600">Salva a divisão da coleta</text>
      
    </g>
  
</svg>