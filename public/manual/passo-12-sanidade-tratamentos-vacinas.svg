<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#ecfdf5"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="760" height="460" rx="18" fill="url(#bgGrad)" stroke="#bbf7d0" stroke-width="1.5"/>

  <!-- Top Browser / App Frame -->
  <g transform="translate(28, 22)" filter="url(#shadow)">
    <rect width="704" height="416" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <!-- App Topbar -->
    <path d="M0 14 Q0 0 14 0 L690 0 Q704 0 704 14 L704 54 L0 54 Z" fill="#15803d"/>
    <!-- Brand Dot & Title -->
    <circle cx="24" cy="27" r="11" fill="#ffffff" opacity="0.2"/>
    <text x="24" y="31" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="800">🌱</text>
    <text x="44" y="25" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="800">Anota Aí Agro — Sanidade — Tratamentos Veterinários & Vacinação</text>
    <text x="44" y="42" fill="#dcfce7" font-family="system-ui, sans-serif" font-size="11">Controle rigoroso de carência (leite e carne) e calendário de vacinas</text>
    <rect x="570" y="15" width="116" height="24" rx="12" fill="#ffffff" opacity="0.18"/>
    <text x="628" y="31" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Saúde do Rebanho</text>

    <!-- Screen Inner Content -->
    <g transform="translate(20, 68)">
      
        <!-- Left: Treatments -->
        <rect x="10" y="6" width="318" height="318" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
        <text x="28" y="34" fill="#0f172a" font-family="system-ui, sans-serif" font-size="14" font-weight="800">💊 Novo Tratamento Veterinário</text>

        <text x="28" y="60" fill="#334155" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Animal * / Medicamento *</text>
        <rect x="28" y="66" width="282" height="34" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
        <text x="40" y="88" fill="#0f172a" font-family="system-ui, sans-serif" font-size="12" font-weight="700">#09 Estrela — Cefalosporina (Mastite)</text>

        <rect x="28" y="112" width="136" height="54" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
        <text x="38" y="130" fill="#991b1b" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">Carência Leite (dias)</text>
        <text x="38" y="152" fill="#dc2626" font-family="system-ui, sans-serif" font-size="16" font-weight="800">4 dias</text>

        <rect x="174" y="112" width="136" height="54" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
        <text x="184" y="130" fill="#92400e" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">Carência Abate (dias)</text>
        <text x="184" y="152" fill="#b45309" font-family="system-ui, sans-serif" font-size="16" font-weight="800">14 dias</text>

        <rect x="28" y="178" width="282" height="56" rx="8" fill="#fef2f2" stroke="#fecaca"/>
        <text x="40" y="198" fill="#991b1b" font-family="system-ui, sans-serif" font-size="11" font-weight="700">🚫 Alerta gerado automaticamente:</text>
        <text x="40" y="214" fill="#b91c1c" font-family="system-ui, sans-serif" font-size="10.5">Leite fora do tanque até 21/11 · Abate liberado após 01/12</text>

        <rect x="28" y="250" width="282" height="38" rx="8" fill="#15803d"/>
        <text x="169" y="274" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700">Salvar Tratamento</text>

        <!-- Right: Vaccinations -->
        <rect x="342" y="6" width="312" height="318" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
        <text x="360" y="34" fill="#0f172a" font-family="system-ui, sans-serif" font-size="14" font-weight="800">💉 Calendário de Vacinação</text>

        <rect x="360" y="52" width="276" height="72" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
        <text x="374" y="74" fill="#991b1b" font-family="system-ui, sans-serif" font-size="12" font-weight="800">Atrasada: Brucelose — #18 Bonequinha</text>
        <text x="374" y="92" fill="#b91c1c" font-family="system-ui, sans-serif" font-size="11">Prevista para: 15/11/2026</text>
        <rect x="374" y="98" width="160" height="20" rx="5" fill="#dc2626"/>
        <text x="454" y="112" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="700">✓ Marcar como Aplicada Hoje</text>

        <rect x="360" y="136" width="276" height="66" rx="10" fill="#fffbeb" stroke="#fcd34d"/>
        <text x="374" y="158" fill="#92400e" font-family="system-ui, sans-serif" font-size="12" font-weight="800">Próxima: Raiva — #04 Mimosa</text>
        <text x="374" y="176" fill="#b45309" font-family="system-ui, sans-serif" font-size="11">Prevista para: 20/11/2026 (em 3 dias)</text>

        <rect x="360" y="214" width="276" height="66" rx="10" fill="#f0fdf4" stroke="#86efac"/>
        <text x="374" y="236" fill="#14532d" font-family="system-ui, sans-serif" font-size="12" font-weight="800">Aplicada: Febre Aftosa — #01 Boneca</text>
        <text x="374" y="254" fill="#166534" font-family="system-ui, sans-serif" font-size="11">Aplicada em 05/11/2026 · Lote 441-B</text>
      
    </g>
  </g>

  <!-- Callouts Overlay -->
  
    <g transform="translate(64, 205)">
      <circle cx="0" cy="0" r="15" fill="#dc2626" stroke="#ffffff" stroke-width="2.5" filter="url(#shadow)" />
      <text x="0" y="5" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800">1</text>
      
        <rect x="20" y="-13" width="168" height="26" rx="6" fill="#111827" opacity="0.92" />
        <text x="30" y="4" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600">Dias de carência leite/abate</text>
      
    </g>
  

    <g transform="translate(400, 155)">
      <circle cx="0" cy="0" r="15" fill="#dc2626" stroke="#ffffff" stroke-width="2.5" filter="url(#shadow)" />
      <text x="0" y="5" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800">2</text>
      
        <rect x="20" y="-13" width="148" height="26" rx="6" fill="#111827" opacity="0.92" />
        <text x="30" y="4" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600">Baixa rápida da vacina</text>
      
    </g>
  
</svg>